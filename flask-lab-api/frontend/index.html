                          <input class="form-control form-control-sm rounded-lg border-outline-variant"
                            placeholder="Ej: separar suero antes de enviar" type="text" v-model="m.observacion" />
                        </div>
                      </div>

                      <!-- Alternativas de ESTA muestra: subcategoría anidada, no una muestra nueva -->
                      <div class="mt-3 ps-3 border-start border-outline-variant" v-if="m.alternativas.length">
                        <div :key="a._key" class="border border-outline-variant rounded-lg p-3 mb-2 bg-white"
                          v-for="(a, aidx) in m.alternativas">
                          <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="font-bold text-sm">
                              <span class="badge rounded-pill badge-xs bg-tertiary me-1">Alternativa</span>
                              Alternativa {{ aidx + 1 }} de Muestra {{ idx + 1 }}
                            </span>
                            <div class="d-flex gap-1">
                              <button :disabled="aidx === 0" @click="moveAlternativaRow(idx, aidx, -1)"
                                class="btn btn-xs btn-light border" title="Subir" type="button">
                                <i class="bi bi-arrow-up"></i>
                              </button>
                              <button :disabled="aidx === m.alternativas.length - 1"
                                @click="moveAlternativaRow(idx, aidx, 1)" class="btn btn-xs btn-light border"
                                title="Bajar" type="button">
                                <i class="bi bi-arrow-down"></i>
                              </button>
                              <button @click="duplicateAlternativaRow(idx, aidx)" class="btn btn-xs btn-light border"
                                title="Duplicar" type="button">
                                <i class="bi bi-copy"></i>
                              </button>
                              <button @click="removeAlternativaRow(idx, aidx)" class="btn btn-xs btn-outline-danger"
                                title="Quitar" type="button">
                                <i class="bi bi-trash"></i>
                              </button>
                            </div>
                          </div>
                          <div class="row g-2">
                            <div :key="c.field" class="col-md-3" v-for="c in MUESTRA_CAMPOS">
                              <label class="form-label text-xs font-semibold text-on-surface mb-1">{{ c.label }}{{
                                c.required ? ' *' : '' }}</label>
                              <template v-if="c.type === 'combo'">
                                <div class="combo-field">
                                  <input :list="'dl_' + a._key + '_' + c.field" :required="c.required"
                                    :value="a['_text_' + c.field]" @input="onComboInput(a, c, $event.target.value)"
                                    class="form-control form-control-sm rounded-lg border-outline-variant combo-input"
                                    placeholder="Escribí para buscar..." type="text" />
                                  <i class="bi bi-search combo-field-icon"></i>
                                </div>
                                <datalist :id="'dl_' + a._key + '_' + c.field">
                                  <option :key="opt.id" :value="opt.nombre" v-for="opt in refData[c.ref]"></option>
                                </datalist>
                                <button v-if="comboNeedsCreate(a, c)" @click="crearValorCombo(a, c)"
                                  class="combo-create-btn" type="button">
                                  <i class="bi bi-plus-lg"></i>Crear "{{ a['_text_' + c.field] }}"
                                </button>
                              </template>
                              <input class="form-control form-control-sm rounded-lg border-outline-variant" step="0.01"
                                type="number" v-else v-model.number="a[c.field]" />
                            </div>
                            <div class="col-md-6">
                              <label class="form-label text-xs font-semibold text-on-surface mb-1">Observación
                                específica de esta alternativa</label>
                              <input class="form-control form-control-sm rounded-lg border-outline-variant"
                                placeholder="Ej: separar suero antes de enviar" type="text" v-model="a.observacion" />
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="mt-2 text-end">
                        <button @click="addAlternativaRow(idx)"
                          class="btn btn-xs btn-outline-primary border-primary text-primary rounded-lg" type="button">
                          <i class="bi bi-plus-lg me-1"></i>Agregar Alternativa
                        </button>
                      </div>
                    </div>
                  </template>

                  <!-- Resto de secciones: campos genéricos (texto/select/fk) -->
                  <div class="row g-3" v-else>
                    <!-- Código Hexalis: pertenece al Estudio elegido en "Identificación". Si el Estudio
                       tipeado ahí no existe todavía, se completa acá para crearlo (needsNewEstudio);
                       si ya existe, queda de sólo lectura mostrando el que ya tiene. -->
                    <div class="col-md-6" v-if="section.key === 'paridad_publicacion'">
                      <label class="form-label text-xs font-semibold text-on-surface mb-1">Código Hexalis{{
                        needsNewEstudio ? ' del Estudio nuevo *' : '' }}</label>
                      <input
                        class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                        placeholder="Ej: 660352" required type="text" v-if="needsNewEstudio"
                        v-model="newEstudioCodigo" />
                      <input
                        class="form-control form-control-sm rounded-lg border-outline-variant bg-surface-container-low"
                        type="text" :value="codigoHexalisSeleccionado" v-else />
                    </div>
                    <div :key="col.field" class="col-md-6" v-for="col in fieldsForSection(section.key)">
                      <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label text-xs font-semibold text-on-surface mb-0">{{ col.label }}</label>
                        <button v-if="col.type === 'richtext'" @click="abrirEditorAmpliado(col.field, col.label)"
                          class="btn btn-xs btn-link text-primary p-0 text-decoration-none" type="button">
                          <i class="bi bi-arrows-angle-expand me-1"></i>Ampliar
                        </button>
                      </div>
                      <input :autocomplete="col.type === 'password' ? 'new-password' : 'off'" :required="col.required"
                        :type="col.type"
                        class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                        v-if="col.type === 'text' || col.type === 'number' || col.type === 'date' || col.type === 'password'"
                        v-model="formData[col.field]" />
                      <textarea
                        class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                        rows="3" v-else-if="col.type === 'textarea'" v-model="formData[col.field]"></textarea>
                      <rich-editor placeholder="Escribí acá..." v-else-if="col.type === 'richtext'"
                        v-model="formData[col.field]"></rich-editor>
                      <select :required="col.required"
                        class="form-select form-select-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                        v-else-if="col.type === 'select'" v-model="formData[col.field]">
                        <option :key="o" :value="o" v-for="o in col.options">{{ o }}</option>
                      </select>
                      <template v-else-if="col.type === 'fk'">
                        <input :list="'dl_' + col.field"
                          :required="col.required && !(col.field === 'id_estudio' && needsNewEstudio)"
                          :value="fkText[col.field]" @input="onFkInput(col.field, col.ref, $event.target.value)"
                          class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                          placeholder="Escribí para buscar..." type="text" />
                        <datalist :id="'dl_' + col.field">
                          <option :key="opt.id" :value="fkLabel(col.ref, opt.id)" v-for="opt in refData[col.ref]">
                          </option>
                        </datalist>
                        <div v-if="col.field === 'id_estudio' && needsNewEstudio" class="text-xs mt-1 text-primary">
                          No existe ese Estudio: se va a crear uno nuevo con este nombre. Completá su Código Hexalis
                          en la sección "Paridad y Publicación".
                        </div>
                        <div :class="formData[col.field] ? 'text-success-teal' : 'text-britlab-gray'"
                          class="text-xs mt-1" v-else>
                          {{ formData[col.field] ? ('Seleccionado: #' + formData[col.field]) : (col.required ? 'Elegí una opción de la lista' : 'Vacío (opcional)') }}
                        </div>
                      </template>
                      <div class="form-check form-switch mt-1" v-else-if="col.type === 'switch'">
                        <input :id="'sw_' + col.field" class="form-check-input" role="switch" type="checkbox"
                          v-model="formData[col.field]" />
                        <label :for="'sw_' + col.field" class="form-check-label text-xs">{{ formData[col.field] ? 'Sí' :
                          'No' }}</label>
                      </div>
                    </div>
                  </div>

                  <!-- Documentación (PDF) de este dropdown: Preanalítico, Indicaciones
                   Paciente y Modelo Derivante admiten 1..N archivos cada uno (por
                   categoría propia). Si el registro todavía no se guardó, los
                   elegidos quedan bufferados y se suben recién al guardar (igual
                   que las muestras); si ya existe, se suben al toque. Sólo
                   "Modelo Derivante" permite ponerle una descripción a cada PDF. -->
                  <div class="mt-3 pt-3 border-top border-outline-variant"
                    v-if="SECCIONES_CON_PDF.includes(section.key)">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <label class="form-label text-xs font-semibold text-on-surface mb-0">{{
                        LABEL_PDF_POR_SECCION[section.key] }}</label>
                      <label class="btn btn-xs btn-outline-primary border-primary text-primary rounded-lg mb-0"
                        :class="{ disabled: modeloSubiendo }">
                        <i class="bi bi-plus-lg me-1"></i>{{ modeloSubiendo ? 'Subiendo...' : 'Agregar PDF' }}
                        <input accept="application/pdf" :disabled="modeloSubiendo"
                          @change="onSeleccionarPdf($event, CATEGORIA_PDF_POR_SECCION[section.key])" hidden
                          type="file" />
                      </label>
                    </div>
                    <div class="text-center py-2" v-if="modelosLoading">
                      <div class="spinner-border spinner-border-sm text-primary-container" role="status"></div>
                    </div>
                    <p class="text-on-surface-variant text-xs"
                      v-else-if="!modelosPorCategoria[CATEGORIA_PDF_POR_SECCION[section.key]].length && !modelosPendientesPorCategoria[CATEGORIA_PDF_POR_SECCION[section.key]].length">
                      Todavía no se cargó ningún PDF acá.
                    </p>
                    <ul class="list-unstyled mb-0" v-else>
                      <li :key="m.id" class="border border-outline-variant rounded-lg px-3 py-2 mb-2"
                        v-for="m in modelosPorCategoria[CATEGORIA_PDF_POR_SECCION[section.key]]">
                        <div class="d-flex justify-content-between align-items-center">
                          <button @click="abrirModelo(m)"
                            class="d-flex align-items-center gap-2 text-decoration-none btn btn-link p-0 border-0"
                            type="button">
                            <i class="bi bi-file-earmark-pdf text-danger"></i>
                            <span class="text-xs font-medium">{{ m.nombre_archivo }}</span>
                          </button>
                          <button @click="eliminarModelo(m, CATEGORIA_PDF_POR_SECCION[section.key])"
                            class="btn btn-xs btn-outline-danger" title="Eliminar" type="button">
                            <i class="bi bi-trash"></i>
                          </button>
                        </div>
                        <input v-if="section.key === 'modelo_derivante'" @change="actualizarDescripcionModelo(m)"
                          class="form-control form-control-sm rounded-lg border-outline-variant mt-2"
                          placeholder="Descripción de este archivo (opcional)" type="text" v-model="m.descripcion" />
                      </li>
                      <li :key="m._key"
                        class="border border-dashed border-outline-variant rounded-lg px-3 py-2 mb-2 bg-surface-container-low"
                        v-for="m in modelosPendientesPorCategoria[CATEGORIA_PDF_POR_SECCION[section.key]]">
                        <div class="d-flex justify-content-between align-items-center">
                          <span class="d-flex align-items-center gap-2">
                            <i class="bi bi-file-earmark-pdf text-danger"></i>
                            <span class="text-xs font-medium">{{ m.file.name }}</span>
                            <span class="badge rounded-pill bg-tertiary badge-xs">Pendiente</span>
                          </span>
                          <button @click="quitarModeloPendiente(CATEGORIA_PDF_POR_SECCION[section.key], m)"
                            class="btn btn-xs btn-outline-danger" title="Quitar" type="button">
                            <i class="bi bi-trash"></i>
                          </button>
                        </div>
                        <input v-if="section.key === 'modelo_derivante'"
                          class="form-control form-control-sm rounded-lg border-outline-variant mt-2"
                          placeholder="Descripción de este archivo (opcional)" type="text" v-model="m.descripcion" />
                      </li>
                    </ul>
                    <p class="text-on-surface-variant text-xs mb-0 mt-1"
                      v-if="modalMode === 'create' && modelosPendientesPorCategoria[CATEGORIA_PDF_POR_SECCION[section.key]].length">
                      Se van a subir al guardar el estudio.
                    </p>
                  </div>
                </div>
              </div>

              <div class="mt-4 text-end pt-3 border-t border-outline-variant">
                <button @click="cancelEstudioColegaForm"
                  class="btn btn-sm btn-light border-outline-variant text-on-surface me-2 rounded-lg px-3"
                  type="button">Cancelar</button>
                <button class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3"
                  type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </main>
      </div>

      <!-- Modal Formulario -->
      <div aria-hidden="true" class="modal fade" id="crudModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
              <h5 class="modal-title font-bold text-primary text-base">{{ modalMode === 'create' ? 'Nuevo' : 'Editar' }}
                {{
                modalEntity ? modalEntity.singular : '' }}</h5>
              <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body p-4">
              <form @submit.prevent="saveItem($event)" novalidate>

                <!-- Estudio x Laboratorio Procesante ya no usa este modal (tiene su
                   propia pantalla completa): esto evita ids duplicados en el DOM
                   mientras modalEntityKey sigue en 'estudio_colega' entre pantallas. -->
                <div class="row g-3" v-if="modalEntityKey !== 'estudio_colega'">
                  <div :key="col.field" class="col-md-6" v-for="col in (modalEntity ? modalEntity.fields : [])">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">{{ col.label }}</label>
                    <input :autocomplete="col.type === 'password' ? 'new-password' : 'off'" :required="col.required"
                      :type="col.type"
                      class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                      v-if="col.type === 'text' || col.type === 'number' || col.type === 'date' || col.type === 'password'"
                      v-model="formData[col.field]" />
                    <textarea
                      class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                      rows="3" v-else-if="col.type === 'textarea'" v-model="formData[col.field]"></textarea>
                    <select :required="col.required"
                      class="form-select form-select-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                      v-else-if="col.type === 'select'" v-model="formData[col.field]">
                      <option :key="o" :value="o" v-for="o in col.options">{{ o }}</option>
                    </select>
                    <template v-else-if="col.type === 'fk'">
                      <input :list="'dl_' + col.field" :required="col.required" :value="fkText[col.field]"
                        @input="onFkInput(col.field, col.ref, $event.target.value)"
                        class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                        placeholder="Escribí para buscar..." type="text" />
                      <datalist :id="'dl_' + col.field">
                        <option :key="opt.id" :value="fkLabel(col.ref, opt.id)" v-for="opt in refData[col.ref]">
                        </option>
                      </datalist>
                      <div :class="formData[col.field] ? 'text-success-teal' : 'text-britlab-gray'"
                        class="text-xs mt-1">
                        {{ formData[col.field] ? ('Seleccionado: #' + formData[col.field]) : (col.required ? 'Elegí una opción de la lista' : 'Vacío (opcional)') }}
                      </div>
                    </template>
                    <div class="form-check form-switch mt-1" v-else-if="col.type === 'switch'">
                      <input :id="'sw_' + col.field" class="form-check-input" role="switch" type="checkbox"
                        v-model="formData[col.field]" />
                      <label :for="'sw_' + col.field" class="form-check-label text-xs">{{ formData[col.field] ? 'Sí' :
                        'No' }}</label>
                    </div>
                  </div>
                </div>

                <div class="mt-4 text-end pt-3 border-t border-outline-variant">
                  <button class="btn btn-sm btn-light border-outline-variant text-on-surface me-2 rounded-lg px-3"
                    data-bs-dismiss="modal" type="button">Cancelar</button>
                  <button class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3"
                    type="submit">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal "Ver ampliado": el mismo campo de texto enriquecido del formulario
         que se haya abierto (Estudio x Colega o FAQ), en grande, para escribir
         más cómodo. Edita richModalTargetObj[richModalField] en vivo (no hay
         draft/cancelar: cerrar el modal no descarta nada). -->
      <div aria-hidden="true" class="modal fade" id="richEditorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
              <h5 class="modal-title font-bold text-primary text-base">{{ richModalLabel }}</h5>
              <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body p-4">
              <rich-editor v-if="richModalField" large :links="richModalTargetKey === 'faqForm'"
                placeholder="Escribí acá..." v-model="richModalTargetObj[richModalField]"></rich-editor>
            </div>
            <div class="modal-footer border-t border-outline-variant">
              <button class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3"
                data-bs-dismiss="modal" type="button">Listo</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal: agregar/editar un ítem (Estudio) de un Tarifario. Si es
         nuevo, además pide el período/precio inicial (todo ítem arranca con
         un precio vigente); si es edición, el precio NO se toca acá (ver
         tarifarioPrecioModal: actualizarlo siempre pide un período nuevo). -->
      <div aria-hidden="true" class="modal fade" id="tarifarioItemModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarTarifarioItem($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">{{ tarifarioItemModalMode === 'create' ?
                  'Agregar ítem' : 'Editar ítem' }}</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4">
                <div class="row g-3">
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Estudio *</label>
                    <input :value="tarifarioItemFkText" @input="onTarifarioItemEstudioInput($event.target.value)"
                      class="form-control form-control-sm rounded-lg border-outline-variant"
                      list="dl_tarifario_item_estudio" placeholder="Escribí para buscar..." required type="text" />
                    <datalist id="dl_tarifario_item_estudio">
                      <option :key="e.id" :value="tarifarioEstudioLabel(e)" v-for="e in tarifarioEstudiosDisponibles">
                      </option>
                    </datalist>
                    <div :class="tarifarioItemForm.id_estudio ? 'text-success-teal' : 'text-britlab-gray'"
                      class="text-xs mt-1">
                      {{ tarifarioItemForm.id_estudio ? ('Seleccionado: #' + tarifarioItemForm.id_estudio) : 'Elegí una opción de la lista' }}
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Nemónico</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="tarifarioItemForm.nemonico" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Código</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="tarifarioItemForm.codigo" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Estado</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant"
                      v-model="tarifarioItemForm.estado">
                      <option :key="e" :value="e" v-for="e in ESTADOS_TARIFARIO_ITEM">{{ e }}</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Nota</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="tarifarioItemForm.nota" />
                  </div>
                  <template v-if="tarifarioItemModalMode === 'create'">
                    <div class="col-md-12">
                      <hr class="my-0">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label text-xs font-semibold text-on-surface mb-1">Período inicial *</label>
                      <input class="form-control form-control-sm rounded-lg border-outline-variant"
                        placeholder="Ej: FEBRERO 2026" required type="text" v-model="tarifarioItemForm.periodo" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label text-xs font-semibold text-on-surface mb-1">Precio inicial *</label>
                      <input class="form-control form-control-sm rounded-lg border-outline-variant" min="0" required
                        step="0.01" type="number" v-model.number="tarifarioItemForm.precio" />
                    </div>
                  </template>
                </div>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="tarifarioItemGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  tarifarioItemGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: actualizar el precio de un ítem. SIEMPRE pide un período
         nuevo y distinto: nunca pisa el precio/período vigente, así el
         historial completo queda preservado (ver historialModal). -->
      <div aria-hidden="true" class="modal fade" id="tarifarioPrecioModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarNuevoPrecio($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">Actualizar precio</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4" v-if="tarifarioPrecioContexto">
                <p class="text-xs text-on-surface-variant mb-3">
                  {{ tarifarioPrecioContexto.estudio_descripcion }} — precio vigente:
                  <strong>{{ tarifarioPrecioContexto.precio_vigente != null ?
                    tarifarioPrecioContexto.precio_vigente.toLocaleString('es-AR', { style: 'currency', currency:
                    tarifarioSeleccionado.moneda || 'ARS' }) : '-' }}</strong>
                  ({{ tarifarioPrecioContexto.periodo_vigente || 'sin período' }})
                </p>
                <div class="alert alert-warning rounded-lg text-xs py-2 mb-3">
                  <i class="bi bi-info-circle me-1"></i>Para actualizar un precio hay que cargar un período nuevo: el
                  precio anterior queda en el historial, no se pisa.
                </div>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Período nuevo *</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant"
                      placeholder="Ej: MARZO 2026" required type="text" v-model="tarifarioPrecioForm.periodo" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Precio nuevo *</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" min="0" required
                      step="0.01" type="number" v-model.number="tarifarioPrecioForm.precio" />
                  </div>
                </div>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="tarifarioPrecioGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  tarifarioPrecioGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: historial de precios (todos los períodos) de un ítem. La
         auditoría (usuario/fecha de creación y edición) sólo se muestra a
         SuperAdmin (isSuperAdmin): la API ya la manda en null para todos los
         demás roles, pero además se ocultan las columnas acá. -->
      <div aria-hidden="true" class="modal fade" id="tarifarioHistorialModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
              <div>
                <h5 class="modal-title font-bold text-primary text-base">Historial de precios</h5>
                <div class="text-xs text-on-surface-variant mt-1" v-if="tarifarioHistorialItem">{{
                  tarifarioHistorialItem.estudio_descripcion }}</div>
              </div>
              <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body p-4">
              <div class="text-center py-4" v-if="tarifarioHistorialLoading">
                <div class="spinner-border spinner-border-sm text-primary-container" role="status"></div>
              </div>
              <div class="table-container-fixed" v-else>
                <div class="overflow-auto">
                  <table class="table table-hover table-auto-layout">
                    <thead class="table-dark">
                      <tr>
                        <th>Período</th>
                        <th>Precio</th>
                        <template v-if="isSuperAdmin">
                          <th>Creado por</th>
                          <th>Fecha creación</th>
                          <th>Modificado por</th>
                          <th>Fecha modificación</th>
                        </template>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-if="!tarifarioHistorialPeriodos.length">
                        <td class="text-center text-on-surface-variant py-4" :colspan="isSuperAdmin ? 6 : 2">Sin cambios
                          registrados.</td>
                      </tr>
                      <tr :key="p.id" v-else v-for="p in tarifarioHistorialPeriodos">
                        <td class="font-semibold">{{ p.periodo }}</td>
                        <td class="font-bold text-primary">{{ p.precio.toLocaleString('es-AR', { style: 'currency',
                          currency: (tarifarioSeleccionado && tarifarioSeleccionado.moneda) || 'ARS' }) }}</td>
                        <template v-if="isSuperAdmin">
                          <td>{{ p.creado_por_username || '-' }}</td>
                          <td>{{ p.created_at ? new Date(p.created_at).toLocaleString() : '-' }}</td>
                          <td>{{ p.actualizado_por_username || '-' }}</td>
                          <td>{{ p.updated_at ? new Date(p.updated_at).toLocaleString() : '-' }}</td>
                        </template>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="modal-footer border-t border-outline-variant">
              <button class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3"
                data-bs-dismiss="modal" type="button">Cerrar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal: alta/edición de Nomenclador (ABM propio, reutilizable entre
         Obras Sociales). No tiene DELETE: "Inactivar" desde la pantalla. -->
      <div aria-hidden="true" class="modal fade" id="nomencladorFormModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarNomenclador($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">{{ nomencladorModalMode === 'create' ? 'Nuevo nomenclador' : 'Editar nomenclador' }}</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4">
                <div class="row g-3">
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Nombre *</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" required type="text"
                      v-model="nomencladorForm.nombre" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Tipo</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant"
                      v-model="nomencladorForm.tipo">
                      <option :key="t" :value="t" v-for="t in TIPOS_NOMENCLADOR">{{ TIPOS_NOMENCLADOR_LABEL[t] }}
                      </option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Estado</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant"
                      v-model="nomencladorForm.estado">
                      <option :key="e" :value="e" v-for="e in ESTADOS_SIMPLES">{{ e }}</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Versión / Fecha</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" placeholder="Ej: 2012"
                      type="text" v-model="nomencladorForm.version_o_fecha" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Vigencia</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant"
                      placeholder="Ej: 2024-2025" type="text" v-model="nomencladorForm.vigencia" />
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Link / documento de
                      referencia</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="nomencladorForm.link" />
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Observación</label>
                    <textarea class="form-control form-control-sm rounded-lg border-outline-variant" rows="2"
                      v-model="nomencladorForm.observacion"></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="nomencladorGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  nomencladorGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: alta/edición de Autorizador (ABM propio, reutilizable entre
         Obras Sociales). Las credenciales de cada relación puntual se
         cargan desde la propia Obra Social, no acá. -->
      <div aria-hidden="true" class="modal fade" id="autorizadorFormModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarAutorizador($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">{{ autorizadorModalMode === 'create' ? 'Nuevo autorizador' : 'Editar autorizador' }}</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4">
                <div class="row g-3">
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Nombre *</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" required type="text"
                      v-model="autorizadorForm.nombre" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Tipo</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant"
                      v-model="autorizadorForm.tipo">
                      <option :key="t" :value="t" v-for="t in TIPOS_AUTORIZADOR">{{ t }}</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Estado</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant"
                      v-model="autorizadorForm.estado">
                      <option :key="e" :value="e" v-for="e in ESTADOS_SIMPLES">{{ e }}</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Link de acceso</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="autorizadorForm.link" />
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Instructivo</label>
                    <textarea class="form-control form-control-sm rounded-lg border-outline-variant" rows="2"
                      v-model="autorizadorForm.instructivo"></textarea>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Observación</label>
                    <textarea class="form-control form-control-sm rounded-lg border-outline-variant" rows="2"
                      v-model="autorizadorForm.observacion"></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="autorizadorGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  autorizadorGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: cambiar estado de atención de un Plan puntual (el estado de
         la Obra Social misma sólo se cambia editándola). Siempre deja historial. -->
      <div aria-hidden="true" class="modal fade" id="obraSocialEstadoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarCambioEstado($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">Cambiar estado del plan</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4" v-if="obraSocialEstadoContexto">
                <p class="text-xs text-on-surface-variant mb-3">Plan: <strong>{{ obraSocialEstadoContexto.nombre
                    }}</strong></p>
                <div class="row g-3">
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Nuevo estado *</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant" required
                      v-model="obraSocialEstadoForm.estado">
                      <option :key="e" :value="e" v-for="e in ESTADOS_ATENCION">{{ ESTADOS_ATENCION_LABEL[e] }}</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <p class="text-xs text-britlab-gray mb-0"><i class="bi bi-person-check me-1"></i>Se va a registrar
                      como comunicado por <strong>{{ obraSocialEstadoForm.comunicado_por }}</strong> (usuario logueado).
                    </p>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Motivo / observación</label>
                    <textarea class="form-control form-control-sm rounded-lg border-outline-variant" rows="2"
                      v-model="obraSocialEstadoForm.motivo"></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="obraSocialEstadoGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  obraSocialEstadoGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: historial de cambios de estado (Obra Social + sus Planes) -->
      <div aria-hidden="true" class="modal fade" id="obraSocialHistorialModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
              <h5 class="modal-title font-bold text-primary text-base">Historial de estados</h5>
              <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body p-4">
              <div class="text-center py-4" v-if="obraSocialHistorialLoading">
                <div class="spinner-border spinner-border-sm text-primary-container" role="status"></div>
              </div>
              <div class="table-container-fixed" v-else>
                <div class="overflow-auto">
                  <table class="table table-hover table-auto-layout">
                    <thead class="table-dark">
                      <tr>
                        <th>Fecha</th>
                        <th>Alcance</th>
                        <th>Anterior</th>
                        <th>Nuevo</th>
                        <th>Comunicado por</th>
                        <th>Motivo</th>
                        <th>Cargado por</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-if="!obraSocialHistorial.length">
                        <td class="text-center text-on-surface-variant py-4" colspan="7">Sin cambios registrados.</td>
                      </tr>
                      <tr :key="h.id" v-else v-for="h in obraSocialHistorial">
                        <td>{{ h.created_at ? new Date(h.created_at).toLocaleString() : '-' }}</td>
                        <td>{{ h.plan_nombre || 'Obra Social' }}</td>
                        <td>{{ h.estado_anterior ? ESTADOS_ATENCION_LABEL[h.estado_anterior] : '-' }}</td>
                        <td><span :class="['badge rounded-pill badge-xs', ESTADOS_ATENCION_CHIP[h.estado_nuevo]]">{{
                            ESTADOS_ATENCION_LABEL[h.estado_nuevo] }}</span></td>
                        <td>{{ h.comunicado_por || '-' }}</td>
                        <td>{{ h.motivo || '-' }}</td>
                        <td>{{ h.creado_por || '-' }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="modal-footer border-t border-outline-variant">
              <button class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3"
                data-bs-dismiss="modal" type="button">Cerrar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal: agregar/editar un Plan de la Obra Social elegida -->
      <div aria-hidden="true" class="modal fade" id="obraSocialPlanModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarObraSocialPlan($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">{{ obraSocialPlanModalMode === 'create' ?
                  'Agregar plan' : 'Editar plan' }}</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4">
                <div class="row g-3">
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Nombre del plan *</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" required type="text"
                      v-model="obraSocialPlanForm.nombre" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Código Gravado</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="obraSocialPlanForm.codigo_datatech_gravado" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Código Exento</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="obraSocialPlanForm.codigo_datatech_exento" />
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Observación particular</label>
                    <textarea class="form-control form-control-sm rounded-lg border-outline-variant" rows="2"
                      v-model="obraSocialPlanForm.observacion"></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="obraSocialPlanGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  obraSocialPlanGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: agregar/editar un Contacto de la Obra Social elegida -->
      <div aria-hidden="true" class="modal fade" id="obraSocialContactoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarObraSocialContacto($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">{{ obraSocialContactoModalMode === 'create' ?
                  'Agregar contacto' : 'Editar contacto' }}</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Tipo</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant"
                      v-model="obraSocialContactoForm.tipo">
                      <option :key="t" :value="t" v-for="t in TIPOS_CONTACTO">{{ t }}</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Nombre / referente</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="obraSocialContactoForm.nombre" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Teléfono</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="obraSocialContactoForm.telefono" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">WhatsApp</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="obraSocialContactoForm.whatsapp" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Email</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="email"
                      v-model="obraSocialContactoForm.email" />
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Observación</label>
                    <textarea class="form-control form-control-sm rounded-lg border-outline-variant" rows="2"
                      v-model="obraSocialContactoForm.observacion"></textarea>
                  </div>
                </div>
                <p class="text-xs text-britlab-gray mt-2 mb-0"><i class="bi bi-lock me-1"></i>Los contactos son siempre
                  de uso interno.</p>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="obraSocialContactoGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  obraSocialContactoGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: asociar un Nomenclador ya existente a la Obra Social elegida -->
      <div aria-hidden="true" class="modal fade" id="obraSocialNomencladorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarObraSocialNomenclador($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">Asociar nomenclador</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4">
                <label class="form-label text-xs font-semibold text-on-surface mb-1">Nomenclador *</label>
                <select class="form-select form-select-sm rounded-lg border-outline-variant" required
                  v-model="obraSocialNomencladorSeleccionadoId">
                  <option :value="null" disabled>Elegí un nomenclador...</option>
                  <option :key="n.id" :value="n.id" v-for="n in nomencladoresDisponibles">{{ n.nombre }}</option>
                </select>
                <div class="text-xs text-britlab-gray mt-2" v-if="!nomencladoresDisponibles.length">No hay nomencladores
                  activos cargados todavía. Creá uno desde "Nomencladores".</div>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="obraSocialNomencladorGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  obraSocialNomencladorGuardando ? 'Guardando...' : 'Asociar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal: asociar/editar un Autorizador de la Obra Social elegida, con
         sus credenciales propias de esta relación puntual. -->
      <div aria-hidden="true" class="modal fade" id="obraSocialAutorizadorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg rounded-xl">
            <form @submit.prevent="guardarObraSocialAutorizador($event)" novalidate>
              <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
                <h5 class="modal-title font-bold text-primary text-base">{{ obraSocialAutorizadorModalMode === 'create'
                  ? 'Asociar autorizador' : 'Editar autorizador' }}</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
              </div>
              <div class="modal-body p-4">
                <div class="row g-3">
                  <div class="col-md-12" v-if="obraSocialAutorizadorModalMode === 'create'">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Autorizador *</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant" required
                      v-model="obraSocialAutorizadorForm.id_autorizador">
                      <option :value="null" disabled>Elegí un autorizador...</option>
                      <option :key="a.id" :value="a.id" v-for="a in autorizadoresDisponibles">{{ a.nombre }}</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Prioridad</label>
                    <select class="form-select form-select-sm rounded-lg border-outline-variant"
                      v-model="obraSocialAutorizadorForm.prioridad">
                      <option :key="p" :value="p" v-for="p in PRIORIDADES_AUTORIZADOR">{{ p }}</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Usuario</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="obraSocialAutorizadorForm.usuario" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Contraseña</label>
                    <input class="form-control form-control-sm rounded-lg border-outline-variant" type="text"
                      v-model="obraSocialAutorizadorForm.password" />
                  </div>
                  <div class="col-md-12">
                    <label class="form-label text-xs font-semibold text-on-surface mb-1">Observación</label>
                    <textarea class="form-control form-control-sm rounded-lg border-outline-variant" rows="2"
                      v-model="obraSocialAutorizadorForm.observacion"></textarea>
                  </div>
                </div>
                <p class="text-xs text-britlab-gray mt-2 mb-0"><i class="bi bi-lock me-1"></i>Usuario/contraseña sólo
                  los ve SuperAdmin o quien tenga el permiso puntual habilitado.</p>
              </div>
              <div class="modal-footer border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button :disabled="obraSocialAutorizadorGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  obraSocialAutorizadorGuardando ? 'Guardando...' : 'Guardar' }}</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Panel lateral: Indicaciones al Paciente / Modelo de Informe del Colega -->
      <div class="side-panel-backdrop" @click="closeSidePanel" v-if="sidePanel.open"></div>
      <transition name="side-panel">
        <aside class="side-panel" v-if="sidePanel.open">
          <div class="side-panel-header">
            <h5 class="mb-0 text-primary font-bold text-base">
              {{ sidePanel.kind === 'preanalitico' ? 'Preanalítico' : sidePanel.kind === 'paciente' ? 'Indicaciones al Paciente' : sidePanel.kind === 'muestras' ? 'Muestras' : sidePanel.kind === 'observacion' ?
              'Observaciones' : 'Modelo de Informe del Laboratorio Procesante' }}
            </h5>
            <button @click="closeSidePanel" class="btn-close" type="button"></button>
          </div>
          <div class="side-panel-body">
            <div class="text-center py-4" v-if="sidePanel.loadingModelos">
              <div class="spinner-border spinner-border-sm text-primary-container" role="status"></div>
            </div>
            <template v-else>
              <!-- Preanalítico: descripción + PDFs -->
              <template v-if="sidePanel.kind === 'preanalitico'">
                <h6 class="text-xs font-bold text-britlab-gray mb-2" style="letter-spacing: .05em;">DESCRIPCIÓN</h6>
                <div class="rich-display mb-4" v-if="sidePanel.item.preanalitico_descripcion"
                  v-html="sidePanel.item.preanalitico_descripcion"></div>
                <p class="text-on-surface-variant text-xs mb-4" v-else>Sin descripción cargada.</p>
              </template>

              <!-- Indicaciones al Paciente: descripción (o link) + PDFs -->
              <template v-if="sidePanel.kind === 'paciente'">
                <h6 class="text-xs font-bold text-britlab-gray mb-2" style="letter-spacing: .05em;">DESCRIPCIÓN</h6>
                <a v-if="sidePanel.item.indicaciones_pacientes && sidePanel.item.indicaciones_pacientes.startsWith('http')"
                  :href="sidePanel.item.indicaciones_pacientes" target="_blank" rel="noopener"
                  class="btn btn-sm btn-primary bg-primary border-primary mb-4">
                  <i class="bi bi-box-arrow-up-right me-1"></i>Abrir enlace
                </a>
                <div class="rich-display mb-4" v-else-if="sidePanel.item.indicaciones_pacientes"
                  v-html="sidePanel.item.indicaciones_pacientes"></div>
                <p class="text-on-surface-variant text-xs mb-4" v-else>Sin descripción cargada.</p>
              </template>

              <!-- Modelo Colega: Indicaciones al Profesional/Derivante + Observaciones de Modelo Derivante + PDFs (con descripción propia) -->
              <template v-if="sidePanel.kind === 'colega'">
                <h6 class="text-xs font-bold text-britlab-gray mb-2" style="letter-spacing: .05em;">INDICACIONES AL
                  PROFESIONAL / DERIVANTE</h6>
                <div class="rich-display mb-4" v-if="sidePanel.item.indicaciones_colega"
                  v-html="sidePanel.item.indicaciones_colega"></div>
                <p class="text-on-surface-variant text-xs mb-4" v-else>Sin indicaciones cargadas.</p>

                <h6 class="text-xs font-bold text-britlab-gray mb-2" style="letter-spacing: .05em;">OBSERVACIONES DEL
                  MODELO DERIVANTE</h6>
                <div class="rich-display mb-4" v-if="sidePanel.item.modelo_derivante_observaciones"
                  v-html="sidePanel.item.modelo_derivante_observaciones"></div>
                <p class="text-on-surface-variant text-xs mb-4" v-else>Sin observaciones cargadas.</p>
              </template>

              <!-- Observaciones generales del registro (sin PDFs propios) -->
              <template v-if="sidePanel.kind === 'observacion'">
                <div class="rich-display mb-4" v-if="sidePanel.item.observacion" v-html="sidePanel.item.observacion">
                </div>
                <p class="text-on-surface-variant text-xs mb-4" v-else>Sin observaciones cargadas.</p>
              </template>

              <!-- Muestras: todas, en orden, cada una con sus alternativas -->
              <template v-if="sidePanel.kind === 'muestras'">
                <p class="text-britlab-gray font-medium text-xs" v-if="!sidePanel.muestras.length">Sin muestras</p>
                <div :key="m.id" class="border border-outline-variant rounded-lg p-2 mb-2" v-else
                  v-for="(m, idx) in sidePanel.muestras">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="font-bold text-xs">Muestra {{ idx + 1 }}: {{ m.tipo_muestra || '-' }}</span>
                  </div>
                  <dl class="mb-0 text-xs">
                    <div class="d-flex justify-content-between py-1" v-if="m.volumen">
                      <dt class="text-on-surface-variant">Volumen</dt>
                      <dd class="mb-0">{{ m.volumen }} {{ m.unidad_medida || '' }}</dd>
                    </div>
                    <div class="d-flex justify-content-between py-1" v-if="m.aditivo">
                      <dt class="text-on-surface-variant">Aditivo</dt>
                      <dd class="mb-0">{{ m.aditivo }}</dd>
                    </div>
                    <div class="d-flex justify-content-between py-1" v-if="m.recipiente">
                      <dt class="text-on-surface-variant">Recipiente</dt>
                      <dd class="mb-0">{{ m.recipiente }}</dd>
                    </div>
                    <div class="d-flex justify-content-between py-1" v-if="m.conservacion">
                      <dt class="text-on-surface-variant">Conservación</dt>
                      <dd class="mb-0">{{ m.conservacion }}</dd>
                    </div>
                    <div class="d-flex justify-content-between py-1" v-if="m.modalidad_recoleccion">
                      <dt class="text-on-surface-variant">Modalidad</dt>
                      <dd class="mb-0">{{ m.modalidad_recoleccion }}</dd>
                    </div>
                    <div class="d-flex justify-content-between py-1" v-if="m.tecnica_recoleccion">
                      <dt class="text-on-surface-variant">Técnica</dt>
                      <dd class="mb-0">{{ m.tecnica_recoleccion }}</dd>
                    </div>
                    <div class="d-flex justify-content-between py-1" v-if="m.condicion_especial">
                      <dt class="text-on-surface-variant">Condición</dt>
                      <dd class="mb-0">{{ m.condicion_especial }}</dd>
                    </div>
                    <div class="d-flex justify-content-between py-1" v-if="m.prioridad_envio">
                      <dt class="text-on-surface-variant">Prioridad</dt>
                      <dd class="mb-0">{{ m.prioridad_envio }}</dd>
                    </div>
                  </dl>
                  <div :key="a.id" class="border-top border-outline-variant mt-2 pt-2 ps-2"
                    v-for="(a, aidx) in (m.alternativas || [])">
                    <span class="badge rounded-pill badge-xs bg-tertiary mb-1">Alternativa {{ aidx + 1 }}: {{
                      a.tipo_muestra || '-' }}</span>
                    <dl class="mb-0 text-xs">
                      <div class="d-flex justify-content-between py-1" v-if="a.volumen">
                        <dt class="text-on-surface-variant">Volumen</dt>
                        <dd class="mb-0">{{ a.volumen }} {{ a.unidad_medida || '' }}</dd>
                      </div>
                      <div class="d-flex justify-content-between py-1" v-if="a.aditivo">
                        <dt class="text-on-surface-variant">Aditivo</dt>
                        <dd class="mb-0">{{ a.aditivo }}</dd>
                      </div>
                      <div class="d-flex justify-content-between py-1" v-if="a.recipiente">
                        <dt class="text-on-surface-variant">Recipiente</dt>
                        <dd class="mb-0">{{ a.recipiente }}</dd>
                      </div>
                      <div class="d-flex justify-content-between py-1" v-if="a.conservacion">
                        <dt class="text-on-surface-variant">Conservación</dt>
                        <dd class="mb-0">{{ a.conservacion }}</dd>
                      </div>
                      <div class="d-flex justify-content-between py-1" v-if="a.modalidad_recoleccion">
                        <dt class="text-on-surface-variant">Modalidad</dt>
                        <dd class="mb-0">{{ a.modalidad_recoleccion }}</dd>
                      </div>
                      <div class="d-flex justify-content-between py-1" v-if="a.tecnica_recoleccion">
                        <dt class="text-on-surface-variant">Técnica</dt>
                        <dd class="mb-0">{{ a.tecnica_recoleccion }}</dd>
                      </div>
                      <div class="d-flex justify-content-between py-1" v-if="a.condicion_especial">
                        <dt class="text-on-surface-variant">Condición</dt>
                        <dd class="mb-0">{{ a.condicion_especial }}</dd>
                      </div>
                      <div class="d-flex justify-content-between py-1" v-if="a.prioridad_envio">
                        <dt class="text-on-surface-variant">Prioridad</dt>
                        <dd class="mb-0">{{ a.prioridad_envio }}</dd>
                      </div>
                    </dl>
                  </div>
                </div>
              </template>

              <!-- PDFs de la categoría abierta (todas las pantallas de documentación comparten este listado) -->
              <template v-if="sidePanel.kind !== 'muestras' && sidePanel.kind !== 'observacion'">
                <h6 class="text-xs font-bold text-britlab-gray mb-2" style="letter-spacing: .05em;">DOCUMENTACIÓN (PDF)
                </h6>
                <p class="text-on-surface-variant text-xs" v-if="!sidePanel.modelos.length">Sin PDFs cargados.</p>
                <ul class="list-unstyled mb-0" v-else>
                  <li :key="m.id" class="mb-2" v-for="m in sidePanel.modelos">
                    <button @click="abrirModelo(m)"
                      class="d-flex align-items-center gap-2 text-decoration-none btn btn-link p-0 border-0"
                      type="button">
                      <i class="bi bi-file-earmark-pdf text-danger"></i>
                      <span class="text-sm font-medium">{{ m.nombre_archivo }}</span>
                    </button>
                    <p class="text-on-surface-variant text-xs mb-0 ms-4" v-if="m.descripcion">{{ m.descripcion }}</p>
                  </li>
                </ul>
              </template>
            </template>
          </div>
        </aside>
      </transition>
    </template>
  </div>

  <!-- Scripts CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
