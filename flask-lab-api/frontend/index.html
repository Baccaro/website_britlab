<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Gestión de Laboratorio Clinical API</title>
  <!-- Google Fonts: Inter (con fallback a fuentes del sistema) -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          "colors": {
            "surface-variant": "#d8e3fb",
            "inverse-on-surface": "#ecf1ff",
            "tertiary-fixed-dim": "#b9c8de",
            "secondary-container": "#9af2ba",
            "surface-container-high": "#dee8ff",
            "secondary-fixed-dim": "#81d9a2",
            "surface-dim": "#cfdaf2",
            "tertiary": "#516072",
            "on-secondary": "#ffffff",
            "outline-variant": "#bbc9cd",
            "success-teal": "#0d9488",
            "on-primary-fixed": "#001f25",
            "on-background": "#111c2d",
            "surface-container-low": "#f0f3ff",
            "on-primary-fixed-variant": "#004e5a",
            "inverse-primary": "#2fd9f4",
            "on-tertiary": "#ffffff",
            "outline": "#6c797d",
            "primary-fixed": "#a2eeff",
            "on-primary-container": "#005763",
            "background": "#f9f9ff",
            "on-error": "#ffffff",
            "primary-container": "#22d3ee",
            "on-surface-variant": "#3c494c",
            "sanatorio-green": "#006b3f",
            "error-container": "#ffdad6",
            "error-red": "#ef4444",
            "error": "#ba1a1a",
            "secondary": "#046d40",
            "secondary-fixed": "#9df5bd",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#e7eeff",
            "tertiary-fixed": "#d4e4fa",
            "surface-container-highest": "#d8e3fb",
            "on-tertiary-fixed-variant": "#39485a",
            "on-primary": "#ffffff",
            "on-secondary-fixed": "#002110",
            "surface": "#f9f9ff",
            "on-tertiary-container": "#415062",
            "on-error-container": "#93000a",
            "primary": "#006877",
            "on-secondary-container": "#0e7144",
            "on-secondary-fixed-variant": "#00522f",
            "surface-bright": "#f9f9ff",
            "tertiary-container": "#b3c2d8",
            "primary-fixed-dim": "#2fd9f4",
            "on-surface": "#111c2d",
            "surface-tint": "#006877",
            "on-tertiary-fixed": "#0d1c2d",
            "britlab-gray": "#929295",
            "clinical-bg": "#f8fafc",
            "inverse-surface": "#263143"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "fontFamily": {
            "sans": ["Inter", "Segoe UI", "Roboto", "Arial", "sans-serif"]
          }
        },
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* El plugin "forms" de Tailwind le agrega su propio alto a <select>,
       que queda más alto que un input/input-group de Bootstrap del mismo
       tamaño ("sm"): esto los vuelve a alinear. */
    select.form-select-sm {
      height: calc(1.5em + .5rem + 2px);
      padding-top: .25rem;
      padding-bottom: .25rem;
    }

    /* Contenedor sin scroll horizontal */
    .table-container-fixed {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
      overflow-x: hidden;
      /* Garantiza que NO haya desplazamiento lateral */
      width: 100%;
    }

    /* Forzar distribución fija de la tabla */
    .table-fixed-layout {
      table-layout: fixed;
      width: 100%;
      margin-bottom: 0;
    }

    /* Ajuste fino de celdas para optimizar espacio */
    .table-fixed-layout th,
    .table-fixed-layout td {
      padding: 0.45rem 0.3rem !important;
      font-size: 0.75rem;
      /* Tamaño de fuente compacto (12px) */
      vertical-align: middle;
      border-bottom-color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Tabla que se ajusta al ancho de su contenido en vez de repartir el
       espacio en columnas fijas: evita blancos sin sentido en columnas
       cortas, y trunca (con "..." y tooltip) las columnas de texto largo
       en vez de estirar toda la tabla. Scrollea horizontal si no entra. */
    .table-auto-layout {
      table-layout: auto;
      width: auto;
      min-width: 100%;
      margin-bottom: 0;
    }

    .table-auto-layout th,
    .table-auto-layout td {
      padding: 0.45rem 0.6rem;
      font-size: 0.75rem;
      vertical-align: middle;
      border-bottom-color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 260px;
    }

    .table-dark th {
      background-color: #006877 !important;
      color: #ffffff !important;
      font-weight: 600;
      border-bottom: none;
    }

    .table-hover tbody tr:hover {
      background-color: #f0f3ff;
    }

    /* Inputs súper compactos para edición en línea */
    .input-compact {
      font-size: 0.72rem;
      padding: 0.15rem 0.25rem;
      height: 26px;
      width: 100%;
    }

    /* Ajustes visuales de badges y botones pequeños */
    .badge-xs {
      font-size: 0.68rem;
      padding: 0.2em 0.4em;
    }

    .btn-xs {
      padding: 0.15rem 0.35rem;
      font-size: 0.75rem;
      line-height: 1;
      border-radius: 4px;
    }


    .section-toggle {
      background: transparent;
      border: none;
      width: 100%;
    }

    .section-toggle:hover {
      background: #f0f3ff;
    }

    /* Botones de navegación en la barra superior (reemplazan al sidebar) */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #111c2d;
      border: 1px solid transparent;
      background: transparent;
      transition: all .15s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: #f0f3ff;
      border-color: #d8e3fb;
    }

    .nav-btn.active {
      background: #006b3f;
      color: #ffffff;
    }

    /* Dropdown "Muestras" de la barra de navegación: se abre con hover, no
       con click (no usa el JS de Bootstrap, sólo su .dropdown-menu para
       posicionar). El padding-top invisible evita que se cierre al mover
       el mouse del botón al menú por el pequeño espacio entre ambos. */
    .hover-dropdown {
      padding-top: 4px;
      margin-top: -4px;
    }

    .hover-dropdown > .dropdown-menu {
      margin-top: 0;
    }

    .hover-dropdown:hover > .dropdown-menu {
      display: block;
    }

    .app-content {
      padding: 1.25rem 1.5rem 2.5rem;
    }

    /* Input autocompletable ("combo") de las dimensiones de una muestra:
       ícono de búsqueda a la derecha, y un chip de "crear valor nuevo"
       cuando lo tipeado no matchea ningún valor existente del catálogo. */
    .combo-field {
      position: relative;
    }

    .combo-field .combo-input {
      padding-right: 1.9rem;
    }

    .combo-field-icon {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: #929295;
      font-size: 0.78rem;
      pointer-events: none;
      transition: color .15s ease;
    }

    .combo-input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 0.15rem rgba(34, 211, 238, 0.25);
    }

    .combo-input:focus + .combo-field-icon {
      color: #006877;
    }

    .combo-create-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: 1px dashed #22d3ee;
      background: rgba(34, 211, 238, 0.08);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: #006877;
      margin-top: 0.35rem;
      transition: background .15s ease;
      animation: comboCreateIn .15s ease;
    }

    .combo-create-btn:hover {
      background: rgba(34, 211, 238, 0.2);
    }

    @keyframes comboCreateIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Editor de texto enriquecido (negrita/cursiva/listas): barra de comandos
       + un div contenteditable con el mismo look que un textarea normal. */
    .rich-editor {
      border: 1px solid #bbc9cd;
      border-radius: 0.5rem;
      overflow: hidden;
    }

    .rich-toolbar {
      display: flex;
      gap: 0.15rem;
      padding: 0.3rem 0.4rem;
      background: #f0f3ff;
      border-bottom: 1px solid #bbc9cd;
    }

    .rich-toolbar button {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 5px;
      color: #3c494c;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .rich-toolbar button:hover {
      background: #d8e3fb;
      color: #006877;
    }

    .rich-content {
      min-height: 80px;
      max-height: 260px;
      overflow-y: auto;
      padding: 0.4rem 0.6rem;
      font-size: 0.8125rem;
      border: none;
      border-radius: 0;
      outline: none;
    }

    .rich-content:empty:before {
      content: attr(data-placeholder);
      color: #929295;
    }

    .rich-content ul, .rich-content ol {
      padding-left: 1.25rem;
      margin-bottom: 0.25rem;
    }

    /* Mismas reglas para mostrar (sin editar) contenido guardado con el editor */
    .rich-display ul, .rich-display ol {
      padding-left: 1.1rem;
      margin-bottom: 0.25rem;
    }

    /* Panel lateral desde la derecha: Indicaciones al Paciente / Modelo de Informe del Colega */
    .side-panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 28, 45, 0.4);
      z-index: 1050;
    }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 420px;
      max-width: 92vw;
      background: #ffffff;
      z-index: 1060;
      box-shadow: -8px 0 24px rgba(0, 0, 0, .15);
      display: flex;
      flex-direction: column;
    }

    .side-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .side-panel-body {
      padding: 1.25rem;
      overflow-y: auto;
      flex: 1;
    }

    .side-panel-enter-active,
    .side-panel-leave-active {
      transition: transform .22s ease;
    }

    .side-panel-enter-from,
    .side-panel-leave-to {
      transform: translateX(100%);
    }

    /* Pantallas de autenticación (login/registro/recuperar contraseña) */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: linear-gradient(160deg, #f0f3ff 0%, #f9f9ff 60%);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 30px -8px rgba(0, 104, 119, 0.15);
      padding: 2rem;
    }

    .auth-logo {
      height: 44px;
      object-fit: contain;
      display: block;
      margin: 0 auto 1.25rem;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- ========================================================= -->
    <!-- AUTENTICACIÓN: login / registro / olvidé mi contraseña /   -->
    <!-- restablecer contraseña. Sin sesión, es lo único visible.   -->
    <!-- ========================================================= -->
    <div class="auth-page" v-if="!isLoggedIn">
      <div class="auth-card">
        <img alt="Sanatorio Británico" class="auth-logo"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8xjJ6dJRSLRqt7KpYtEpbz7Gh2PWgyJUdtyTzFH-v9uJDhLskF5kdd21XrWw0IH6pe_CyvdbVHVIAwOYaYfLJIXcw9N_OLSidR66D8ARKIULP_I68ylkIQO5vjPAVIJBIy_7aMTj_u6_-njf2z5pqj6ZW9-t-hpkWer-ohlfI_WjkoGXsfBE9zNJizKcgb2Czsn6Kr4aWF1_DGKMzcbWVXgYQrBnlWgaE76HTgG9FXxyFbz63URtfyjA2Oz-puz5kkw" />

        <div class="alert alert-danger rounded-lg text-xs" role="alert" v-if="authError">{{ authError }}</div>

        <!-- LOGIN -->
        <template v-if="authView === 'login'">
          <h5 class="text-center font-bold text-primary mb-1">Gestión de Laboratorio</h5>
          <p class="text-center text-on-surface-variant text-xs mb-4">Iniciá sesión para continuar</p>
          <form @submit.prevent="login">
            <div class="mb-3">
              <label class="form-label text-xs font-semibold">Usuario</label>
              <input class="form-control form-control-sm rounded-lg" required type="text" v-model="authForm.username" autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label text-xs font-semibold">Contraseña</label>
              <input class="form-control form-control-sm rounded-lg" required type="password" v-model="authForm.password" />
            </div>
            <button :disabled="authLoading" class="btn btn-primary bg-primary border-primary w-100 rounded-lg shadow-sm" type="submit">
              {{ authLoading ? 'Ingresando...' : 'Iniciar sesión' }}
            </button>
          </form>
          <div class="d-flex justify-content-between mt-3">
            <button @click="goToAuthView('forgot')" class="btn btn-link btn-sm text-primary p-0" type="button">Olvidé mi contraseña</button>
            <button @click="goToAuthView('register')" class="btn btn-link btn-sm text-primary p-0" type="button">Crear cuenta</button>
          </div>
        </template>

        <!-- REGISTRO -->
        <template v-else-if="authView === 'register'">
          <h5 class="text-center font-bold text-primary mb-1">Crear cuenta</h5>
          <p class="text-center text-on-surface-variant text-xs mb-4">
            Se crea con acceso de sólo lectura ("consulta"); un administrador puede ampliarlo luego.
          </p>
          <form @submit.prevent="register">
            <div class="mb-2">
              <label class="form-label text-xs font-semibold">Usuario *</label>
              <input class="form-control form-control-sm rounded-lg" required type="text" v-model="authForm.username" />
            </div>
            <div class="mb-2">
              <label class="form-label text-xs font-semibold">Nombre completo</label>
              <input class="form-control form-control-sm rounded-lg" type="text" v-model="authForm.nombre_completo" />
            </div>
            <div class="mb-2">
              <label class="form-label text-xs font-semibold">Email</label>
              <input class="form-control form-control-sm rounded-lg" type="email" v-model="authForm.email" />
            </div>
            <div class="mb-2">
              <label class="form-label text-xs font-semibold">Contraseña *</label>
              <input class="form-control form-control-sm rounded-lg" minlength="6" required type="password" v-model="authForm.password" />
            </div>
            <div class="mb-3">
              <label class="form-label text-xs font-semibold">Repetir contraseña *</label>
              <input class="form-control form-control-sm rounded-lg" minlength="6" required type="password" v-model="authForm.password2" />
            </div>
            <button :disabled="authLoading" class="btn btn-primary bg-primary border-primary w-100 rounded-lg shadow-sm" type="submit">
              {{ authLoading ? 'Creando cuenta...' : 'Crear cuenta' }}
            </button>
          </form>
          <div class="text-center mt-3">
            <button @click="goToAuthView('login')" class="btn btn-link btn-sm text-primary p-0" type="button">Ya tengo cuenta, iniciar sesión</button>
          </div>
        </template>

        <!-- OLVIDÉ MI CONTRASEÑA -->
        <template v-else-if="authView === 'forgot'">
          <h5 class="text-center font-bold text-primary mb-1">Olvidé mi contraseña</h5>
          <p class="text-center text-on-surface-variant text-xs mb-4">
            Todavía no hay un servicio de email configurado en el sistema: el link para restablecer la contraseña se
            muestra directo acá abajo, en vez de enviarse por correo.
          </p>
          <template v-if="!forgotResult">
            <form @submit.prevent="requestForgotPassword">
              <div class="mb-3">
                <label class="form-label text-xs font-semibold">Usuario</label>
                <input class="form-control form-control-sm rounded-lg" required type="text" v-model="forgotUsername" autofocus />
              </div>
              <button :disabled="authLoading" class="btn btn-primary bg-primary border-primary w-100 rounded-lg shadow-sm" type="submit">
                {{ authLoading ? 'Generando link...' : 'Generar link de recuperación' }}
              </button>
            </form>
          </template>
          <template v-else>
            <div class="alert alert-success rounded-lg text-xs">{{ forgotResult.mensaje }}</div>
            <div class="mb-3" v-if="forgotResult.token">
              <label class="form-label text-xs font-semibold">Token (válido hasta {{ new Date(forgotResult.expira).toLocaleString() }})</label>
              <textarea class="form-control form-control-sm rounded-lg" readonly rows="2">{{ forgotResult.token }}</textarea>
              <button @click="resetForm.token = forgotResult.token; goToAuthView('reset')"
                class="btn btn-sm btn-outline-primary border-primary text-primary rounded-lg mt-2 w-100" type="button">
                Usar este token para restablecer ahora
              </button>
            </div>
          </template>
          <div class="text-center mt-3">
            <button @click="goToAuthView('login')" class="btn btn-link btn-sm text-primary p-0" type="button">Volver a iniciar sesión</button>
          </div>
        </template>

        <!-- RESTABLECER CONTRASEÑA (con el token generado arriba) -->
        <template v-else-if="authView === 'reset'">
          <h5 class="text-center font-bold text-primary mb-1">Restablecer contraseña</h5>
          <p class="text-center text-on-surface-variant text-xs mb-4">Pegá el token recibido y elegí una contraseña nueva.</p>
          <div class="alert alert-success rounded-lg text-xs" v-if="resetResult">{{ resetResult }}</div>
          <form @submit.prevent="submitResetPassword" v-else>
            <div class="mb-2">
              <label class="form-label text-xs font-semibold">Token</label>
              <textarea class="form-control form-control-sm rounded-lg" required rows="2" v-model="resetForm.token"></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label text-xs font-semibold">Contraseña nueva</label>
              <input class="form-control form-control-sm rounded-lg" minlength="6" required type="password" v-model="resetForm.password" />
            </div>
            <div class="mb-3">
              <label class="form-label text-xs font-semibold">Repetir contraseña nueva</label>
              <input class="form-control form-control-sm rounded-lg" minlength="6" required type="password" v-model="resetForm.password2" />
            </div>
            <button :disabled="authLoading" class="btn btn-primary bg-primary border-primary w-100 rounded-lg shadow-sm" type="submit">
              {{ authLoading ? 'Actualizando...' : 'Restablecer contraseña' }}
            </button>
          </form>
          <div class="text-center mt-3">
            <button @click="goToAuthView('login')" class="btn btn-link btn-sm text-primary p-0" type="button">Volver a iniciar sesión</button>
          </div>
        </template>
      </div>
    </div>

    <!-- ========================================================= -->
    <!-- APLICACIÓN (requiere sesión iniciada)                       -->
    <!-- ========================================================= -->
    <template v-else>
    <!-- Navbar (incluye la navegación principal, antes en un sidebar lateral) -->
    <nav class="bg-white mb-6 shadow-sm border-b border-surface-variant">
      <div class="container-fluid px-4 py-3 flex justify-between items-center flex-wrap gap-3">
        <div class="flex items-center gap-4 flex-wrap">
          <img alt="Sanatorio Británico" class="h-10 object-contain"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8xjJ6dJRSLRqt7KpYtEpbz7Gh2PWgyJUdtyTzFH-v9uJDhLskF5kdd21XrWw0IH6pe_CyvdbVHVIAwOYaYfLJIXcw9N_OLSidR66D8ARKIULP_I68ylkIQO5vjPAVIJBIy_7aMTj_u6_-njf2z5pqj6ZW9-t-hpkWer-ohlfI_WjkoGXsfBE9zNJizKcgb2Czsn6Kr4aWF1_DGKMzcbWVXgYQrBnlWgaE76HTgG9FXxyFbz63URtfyjA2Oz-puz5kkw" />
          <div class="h-8 w-px bg-outline-variant hidden md:block"></div>
          <ul class="nav gap-1 mb-0 flex-wrap">
            <li class="nav-item" v-if="pantallaPermitida('estudios')">
              <button :class="['nav-btn', currentView === 'indicaciones' ? 'active' : '']" @click="switchToIndicaciones" type="button">
                <i class="bi bi-file-earmark-medical me-1"></i>Estudios
              </button>
            </li>
            <li class="nav-item" :key="key" v-for="[key, entity] in topNavEntitiesVisibles">
              <button :class="['nav-btn', (currentView === 'crud' && currentEntityKey === key) ? 'active' : '']"
                @click="switchCrudEntity(key)" type="button">
                <i :class="['bi', entity.icon, 'me-1']"></i>{{ entity.label }}
              </button>
            </li>
            <li class="nav-item dropdown hover-dropdown" v-if="muestrasCatalogoEntitiesVisibles.length">
              <button :class="['nav-btn dropdown-toggle', muestrasDropdownActive ? 'active' : '']" type="button">
                <i class="bi bi-droplet me-1"></i>Muestras
              </button>
              <ul class="dropdown-menu shadow-sm">
                <li :key="key" v-for="[key, entity] in muestrasCatalogoEntitiesVisibles">
                  <button class="dropdown-item" :class="(currentView === 'crud' && currentEntityKey === key) ? 'active' : ''"
                    @click="switchCrudEntity(key)" type="button">

                  <input :required="col.required" :type="col.type"
                    class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                    v-if="col.type === 'text' || col.type === 'number' || col.type === 'date'"
                    v-model="formData[col.field]" />
                  <textarea
                    class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                    rows="3" v-else-if="col.type === 'textarea'" v-model="formData[col.field]"></textarea>
                  <rich-editor placeholder="Escribí acá..." v-else-if="col.type === 'richtext'" v-model="formData[col.field]"></rich-editor>
                  <select :required="col.required"
                    class="form-select form-select-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                    v-else-if="col.type === 'select'" v-model="formData[col.field]">
                    <option :key="o" :value="o" v-for="o in col.options">{{ o }}</option>
                  </select>
                  <template v-else-if="col.type === 'fk'">
                    <input :list="'dl_' + col.field" :required="col.required && !(col.field === 'id_estudio' && needsNewEstudio)"
                      :value="fkText[col.field]"
                      @input="onFkInput(col.field, col.ref, $event.target.value)"
                      class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                      placeholder="Escribí para buscar..." type="text" />
                    <datalist :id="'dl_' + col.field">
                      <option :key="opt.id" :value="fkLabel(col.ref, opt.id)" v-for="opt in refData[col.ref]"></option>
                    </datalist>
                    <div v-if="col.field === 'id_estudio' && needsNewEstudio" class="text-xs mt-1 text-primary">
                      No existe ese Estudio: se va a crear uno nuevo con este nombre.
                    </div>
                    <div :class="formData[col.field] ? 'text-success-teal' : 'text-britlab-gray'" class="text-xs mt-1" v-else>
                      {{ formData[col.field] ? ('Seleccionado: #' + formData[col.field]) : (col.required ? 'Elegí una opción de la lista' : 'Vacío (opcional)') }}
                    </div>
                    <div class="mt-2" v-if="col.field === 'id_estudio' && needsNewEstudio">
                      <label class="form-label text-xs font-semibold text-on-surface mb-1">Código Hexalis del Estudio nuevo</label>
                      <input class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                        placeholder="Ej: 660352" required type="text" v-model="newEstudioCodigo" />
                    </div>
                  </template>
                  <div class="form-check form-switch mt-1" v-else-if="col.type === 'switch'">
                    <input :id="'sw_' + col.field" class="form-check-input" role="switch" type="checkbox" v-model="formData[col.field]" />
                    <label :for="'sw_' + col.field" class="form-check-label text-xs">{{ formData[col.field] ? 'Sí' : 'No' }}</label>
                  </div>
                </div>
              </div>

              <!-- Modelos de informe del Colega (PDF): si el registro todavía no
                   se guardó, los elegidos quedan bufferados y se suben recién al
                   guardar (igual que las muestras); si ya existe, se suben al toque. -->
              <div class="mt-3 pt-3 border-top border-outline-variant" v-if="section.key === 'indicaciones_colega'">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <label class="form-label text-xs font-semibold text-on-surface mb-0">Modelos de Informe del Colega (PDF)</label>
                  <label class="btn btn-xs btn-outline-primary border-primary text-primary rounded-lg mb-0"
                    :class="{ disabled: modeloSubiendo }">
                    <i class="bi bi-plus-lg me-1"></i>{{ modeloSubiendo ? 'Subiendo...' : 'Agregar PDF' }}
                    <input accept="application/pdf" :disabled="modeloSubiendo" @change="onSeleccionarPdf" hidden type="file" />
                  </label>
                </div>
                <div class="text-center py-2" v-if="modelosLoading">
                  <div class="spinner-border spinner-border-sm text-primary-container" role="status"></div>
                </div>
                <p class="text-on-surface-variant text-xs" v-else-if="!modelosEstudio.length && !modelosPendientes.length">
                  Todavía no se cargó ningún PDF para este estudio.
                </p>
                <ul class="list-unstyled mb-0" v-else>
                  <li :key="m.id" class="d-flex justify-content-between align-items-center border border-outline-variant rounded-lg px-3 py-2 mb-2"
                    v-for="m in modelosEstudio">
                    <button @click="abrirModelo(m)" class="d-flex align-items-center gap-2 text-decoration-none btn btn-link p-0 border-0" type="button">
                      <i class="bi bi-file-earmark-pdf text-danger"></i>
                      <span class="text-xs font-medium">{{ m.nombre_archivo }}</span>
                    </button>
                    <button @click="eliminarModelo(m)" class="btn btn-xs btn-outline-danger" title="Eliminar" type="button">
                      <i class="bi bi-trash"></i>
                    </button>
                  </li>
                  <li :key="m._key" class="d-flex justify-content-between align-items-center border border-dashed border-outline-variant rounded-lg px-3 py-2 mb-2 bg-surface-container-low"
                    v-for="m in modelosPendientes">
                    <span class="d-flex align-items-center gap-2">
                      <i class="bi bi-file-earmark-pdf text-danger"></i>
                      <span class="text-xs font-medium">{{ m.file.name }}</span>
                      <span class="badge rounded-pill bg-tertiary badge-xs">Pendiente</span>
                    </span>
                    <button @click="quitarModeloPendiente(m)" class="btn btn-xs btn-outline-danger" title="Quitar" type="button">
                      <i class="bi bi-trash"></i>
                    </button>
                  </li>
                </ul>
                <p class="text-on-surface-variant text-xs mb-0 mt-1" v-if="modalMode === 'create' && modelosPendientes.length">
                  Se van a subir al guardar el estudio.
                </p>
              </div>
            </div>
          </div>

          <!-- Observaciones: editor de texto enriquecido simple, no desplegable -->
          <div class="mt-3">
            <label class="form-label text-xs font-semibold text-on-surface mb-1">Observaciones</label>
            <rich-editor placeholder="Escribí acá..." v-model="formData.observacion"></rich-editor>
          </div>

          <div class="mt-4 text-end pt-3 border-t border-outline-variant">
            <button @click="cancelEstudioColegaForm" class="btn btn-sm btn-light border-outline-variant text-on-surface me-2 rounded-lg px-3" type="button">Cancelar</button>
            <button class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">Guardar</button>
          </div>
        </form>
      </div>
      </main>
    </div>

    <!-- Modal Formulario -->
    <div aria-hidden="true" class="modal fade" id="crudModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
        <div class="modal-content border-0 shadow-lg rounded-xl">
          <div class="modal-header bg-surface-container-low border-b border-outline-variant rounded-t-xl">
            <h5 class="modal-title font-bold text-primary text-base">{{ modalMode === 'create' ? 'Nuevo' : 'Editar' }}
              {{
              modalEntity ? modalEntity.singular : '' }}</h5>
            <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
          </div>
          <div class="modal-body p-4">
            <form @submit.prevent="saveItem">

              <!-- Estudio x Laboratorio Procesante ya no usa este modal (tiene su
                   propia pantalla completa): esto evita ids duplicados en el DOM
                   mientras modalEntityKey sigue en 'estudio_colega' entre pantallas. -->
              <div class="row g-3" v-if="modalEntityKey !== 'estudio_colega'">
                <div :key="col.field" class="col-md-6" v-for="col in (modalEntity ? modalEntity.fields : [])">
                  <label class="form-label text-xs font-semibold text-on-surface mb-1">{{ col.label }}</label>
                  <input :required="col.required" :type="col.type"
                    class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                    v-if="col.type === 'text' || col.type === 'number' || col.type === 'date'"
                    v-model="formData[col.field]" />
                  <textarea
                    class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                    rows="3" v-else-if="col.type === 'textarea'" v-model="formData[col.field]"></textarea>
                  <select :required="col.required"
                    class="form-select form-select-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                    v-else-if="col.type === 'select'" v-model="formData[col.field]">
                    <option :key="o" :value="o" v-for="o in col.options">{{ o }}</option>
                  </select>
                  <template v-else-if="col.type === 'fk'">
                    <input :list="'dl_' + col.field" :required="col.required"
                      :value="fkText[col.field]"
                      @input="onFkInput(col.field, col.ref, $event.target.value)"
                      class="form-control form-control-sm rounded-lg border-outline-variant focus:border-primary focus:ring-primary shadow-sm"
                      placeholder="Escribí para buscar..." type="text" />
                    <datalist :id="'dl_' + col.field">
                      <option :key="opt.id" :value="fkLabel(col.ref, opt.id)" v-for="opt in refData[col.ref]"></option>
                    </datalist>
                    <div :class="formData[col.field] ? 'text-success-teal' : 'text-britlab-gray'" class="text-xs mt-1">
                      {{ formData[col.field] ? ('Seleccionado: #' + formData[col.field]) : (col.required ? 'Elegí una opción de la lista' : 'Vacío (opcional)') }}
                    </div>
                  </template>
                  <div class="form-check form-switch mt-1" v-else-if="col.type === 'switch'">
                    <input :id="'sw_' + col.field" class="form-check-input" role="switch" type="checkbox" v-model="formData[col.field]" />
                    <label :for="'sw_' + col.field" class="form-check-label text-xs">{{ formData[col.field] ? 'Sí' : 'No' }}</label>
                  </div>
                </div>
              </div>

              <div class="mt-4 text-end pt-3 border-t border-outline-variant">
                <button class="btn btn-sm btn-light border-outline-variant text-on-surface me-2 rounded-lg px-3"
                  data-bs-dismiss="modal" type="button">Cancelar</button>
                <button class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3"
                  type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel lateral: Indicaciones al Paciente / Modelo de Informe del Colega -->
    <div class="side-panel-backdrop" @click="closeSidePanel" v-if="sidePanel.open"></div>
    <transition name="side-panel">
      <aside class="side-panel" v-if="sidePanel.open">
        <div class="side-panel-header">
          <h5 class="mb-0 text-primary font-bold text-base">
            {{ sidePanel.kind === 'paciente' ? 'Indicaciones al Paciente' : 'Modelo de Informe del Colega' }}
          </h5>
          <button @click="closeSidePanel" class="btn-close" type="button"></button>
        </div>
        <div class="side-panel-body">
          <template v-if="sidePanel.kind === 'paciente'">
            <a v-if="sidePanel.item.indicaciones_pacientes && sidePanel.item.indicaciones_pacientes.startsWith('http')"
              :href="sidePanel.item.indicaciones_pacientes" target="_blank" rel="noopener"
              class="btn btn-sm btn-primary bg-primary border-primary">
              <i class="bi bi-box-arrow-up-right me-1"></i>Abrir enlace
            </a>
            <div class="rich-display" v-else v-html="sidePanel.item.indicaciones_pacientes"></div>
          </template>
          <template v-else>
            <div class="text-center py-4" v-if="sidePanel.loadingModelos">
              <div class="spinner-border spinner-border-sm text-primary-container" role="status"></div>
            </div>
            <template v-else>
              <p class="text-on-surface-variant text-xs" v-if="!sidePanel.modelos.length">Sin PDFs cargados.</p>
              <ul class="list-unstyled mb-4" v-else>
                <li :key="m.id" class="mb-2" v-for="m in sidePanel.modelos">
                  <button @click="abrirModelo(m)" class="d-flex align-items-center gap-2 text-decoration-none btn btn-link p-0 border-0" type="button">
                    <i class="bi bi-file-earmark-pdf text-danger"></i>
                    <span class="text-sm font-medium">{{ m.nombre_archivo }}</span>
                  </button>
                </li>
              </ul>
              <h6 class="text-xs font-bold text-britlab-gray" style="letter-spacing: .05em;">INDICACIONES AL COLEGA</h6>
              <div class="rich-display" v-if="sidePanel.item.indicaciones_colega" v-html="sidePanel.item.indicaciones_colega"></div>
              <p class="text-on-surface-variant text-xs" v-else>Sin indicaciones adicionales.</p>
            </template>
          </template>
        </div>
      </aside>
    </transition>
    </template>
  </div>

  <!-- Scripts CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
