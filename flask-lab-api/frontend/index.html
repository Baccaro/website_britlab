<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Gestión de Laboratorio Clinical API</title>
  <!-- Google Fonts: Manrope (tipografía principal, sans-serif), con Inter y las
       fuentes del sistema como respaldo -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      corePlugins: {
        preflight: false,
      },
      theme: {

            "surface-container-high": "#dee8ff",
            "secondary-fixed-dim": "#81d9a2",
            "surface-dim": "#cfdaf2",
            "tertiary": "#516072",
            "on-secondary": "#ffffff",
            "outline-variant": "#bbc9cd",
            "success-teal": "#0d9488",
            "on-primary-fixed": "#001f25",
            "on-background": "#111c2d",
            "surface-container-low": "#f0f3ff",
            "on-primary-fixed-variant": "#004e5a",
            "inverse-primary": "#2fd9f4",
            "on-tertiary": "#ffffff",
            "outline": "#6c797d",
            "primary-fixed": "#a2eeff",
            "on-primary-container": "#005763",
            "background": "#f9f9ff",
            "on-error": "#ffffff",
            "primary-container": "#22d3ee",
            "on-surface-variant": "#3c494c",
            "sanatorio-green": "#006b3f",
            "error-container": "#ffdad6",
            "error-red": "#ef4444",
            "error": "#ba1a1a",
            "secondary": "#046d40",
            "secondary-fixed": "#9df5bd",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#e7eeff",
            "tertiary-fixed": "#d4e4fa",
            "surface-container-highest": "#d8e3fb",
            "on-tertiary-fixed-variant": "#39485a",
            "on-primary": "#ffffff",
            "on-secondary-fixed": "#002110",

            "sans": ["Manrope", "Inter", "Segoe UI", "Roboto", "Arial", "sans-serif"]

      }
    }
  </script>
  <style>
    /* Bootstrap define sus utilidades de color ("text-primary", "bg-primary",
       "border-primary") con !important, así que ganan siempre por sobre el
       "primary" de Tailwind (que no lleva !important) sin importar el orden:
       cambiar sólo el token de Tailwind no alcanza. La solución real es pisar
       la variable de Bootstrap, de la que esas utilidades leen el color. */
    :root {
      --bs-primary: #3cbad6;
      --bs-primary-rgb: 60, 186, 214;
    }

    /* .btn-primary no lee de --bs-primary en tiempo real: Bootstrap compila
       sus propias variables --bs-btn-* con el azul por defecto ya fijo en el
       CSS. Hay que pisarlas acá directamente para que "Nuevo Estudio",
       "Guardar", "Crear cuenta", etc. usen el color de marca. */
    .btn-primary {
      --bs-btn-bg: #3cbad6;
      --bs-btn-border-color: #3cbad6;
      --bs-btn-hover-bg: #2fa5c0;
      --bs-btn-hover-border-color: #2a97b0;
      --bs-btn-active-bg: #2895ad;
      --bs-btn-active-border-color: #2895ad;
      --bs-btn-disabled-bg: #3cbad6;
      --bs-btn-disabled-border-color: #3cbad6;
      --bs-btn-focus-shadow-rgb: 60, 186, 214;
    }

    /* Mismo caso para los botones "outline" (íconos de Editar, etc.). */
    .btn-outline-primary {
      --bs-btn-color: #3cbad6;
      --bs-btn-border-color: #3cbad6;
      --bs-btn-hover-bg: #3cbad6;
      --bs-btn-hover-border-color: #3cbad6;
      --bs-btn-active-bg: #2fa5c0;
      --bs-btn-active-border-color: #2fa5c0;
      --bs-btn-disabled-color: #3cbad6;
      --bs-btn-disabled-border-color: #3cbad6;
      --bs-btn-focus-shadow-rgb: 60, 186, 214;
    }

    body {
      background-color: #f8fafc;
      font-family: Manrope, Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* El plugin "forms" de Tailwind le agrega su propio alto a <select>,
       que queda más alto que un input/input-group de Bootstrap del mismo
       tamaño ("sm"): esto los vuelve a alinear. */
    select.form-select-sm {
      height: calc(1.5em + .5rem + 2px);
      padding-top: .25rem;
      padding-bottom: .25rem;
    }

    /* Contenedor sin scroll horizontal */
    .table-container-fixed {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
      overflow-x: hidden;
      /* Garantiza que NO haya desplazamiento lateral */
      width: 100%;
      /* Ancho estable de referencia (no crece con la tabla de adentro) para
         que la fila de detalle desplegable pueda anclarse a él: ver
         .fila-detalle-contenido más abajo. */
      container-type: inline-size;
    }

    /* Contenido de la fila de detalle desplegable (p.ej. al hacer click en un
       estudio): si se suman columnas visibles, la tabla de auto-layout que la
       contiene se ensancha y el <td colspan> crece con ella, corriendo este
       contenido hacia la derecha. Ranclarlo (sticky) al borde izquierdo del
       contenedor scrolleable y darle el ancho ESTABLE de .table-container-fixed
       (no el de la tabla) lo deja fijo en la vista pase lo que pase con las columnas. */
    .fila-detalle-contenido {
      position: sticky;
      left: 0;
      width: 100cqw;
      box-sizing: border-box;
    }

    /* Columnas fijas de "Todos los Estudios" (Estudio, Laboratorio Procesante
       y Estado): no se pueden ocultar desde "Columnas" y quedan ancladas
       (sticky) al hacer scroll horizontal. El "left"/"width" de cada una se
       calcula en JS (pinStyle/getColWidth, ver app.js) porque su ancho ahora
       lo puede cambiar el usuario arrastrando el borde de la columna. */
    .col-pin {
      position: sticky;
      z-index: 3;
      background-color: #ffffff;
    }

    thead.table-dark .col-pin {
      z-index: 4;
    }

    /* Separador mínimo entre columnas del encabezado: no distingue ancladas
       de las demás (todas van igual), sólo marca dónde termina cada una. */
    thead.table-dark th {
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    thead.table-dark th:last-child {
      border-right: none;
    }

    tbody tr.table-warning .col-pin {
      background-color: #fff3cd;
    }

    .col-pin-toggle {
      left: 0;
      width: 2rem;
      min-width: 2rem;
      max-width: 2rem;
    }

    .th-resizable {
      position: relative;
    }

    .col-resize-handle {
      /* Adentro del <th> (no "right: -3px" saliéndose de la celda): el th
         hereda "overflow: hidden" de .table-auto-layout y recortaría/haría
         inaccesible cualquier parte del handle que sobresalga del borde. */
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 5;
      user-select: none;
    }

    .col-resize-handle:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Forzar distribución fija de la tabla */
    .table-fixed-layout {
      table-layout: fixed;
      width: 100%;
      margin-bottom: 0;
    }

    /* Ajuste fino de celdas para optimizar espacio */
    .table-fixed-layout th,
    .table-fixed-layout td {
      padding: 0.45rem 0.3rem !important;
      font-size: 0.75rem;
      /* Tamaño de fuente compacto (12px) */
      vertical-align: middle;
      border-bottom-color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Tabla que se ajusta al ancho de su contenido en vez de repartir el
       espacio en columnas fijas: evita blancos sin sentido en columnas
       cortas, y trunca (con "..." y tooltip) las columnas de texto largo
       en vez de estirar toda la tabla. Scrollea horizontal si no entra. */
    .table-auto-layout {
      table-layout: auto;
      width: auto;
      min-width: 100%;
      margin-bottom: 0;
    }

    .table-auto-layout th,
    .table-auto-layout td {
      padding: 0.45rem 0.6rem;
      font-size: 0.75rem;
      vertical-align: middle;
      border-bottom-color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 260px;
    }

    /* Tabla de "Todos los Estudios": se agrega junto con .table-auto-layout
       (mantiene su look) pero reemplaza table-layout/width por columnas de
       ancho explícito (<colgroup>) para que el usuario pueda arrastrar el
       borde de cada una y cambiarle el ancho (ver .col-resize-handle). */
    .table-resizable-cols {
      table-layout: fixed;
      width: max-content;
      min-width: 100%;
    }

    .table-dark th {
      background-color: #006877 !important;
      color: #ffffff !important;
      font-weight: 600;
      border-bottom: none;
    }

    .table-hover tbody tr:hover {
      background-color: #f0f3ff;
    }

    /* La fila de detalle desplegable de "Todos los Estudios" vive dentro de
       .table-auto-layout, cuyo <td> fuerza white-space:nowrap (para truncar
       columnas normales con "..."). Ese nowrap se hereda a todo lo de adentro
       (las tarjetas del detalle), haciendo que el texto se desborde del marco
       en vez de ajustarse: se lo reinicia acá explícitamente. */
    .fila-detalle-expandida {
      white-space: normal !important;
    }

    /* Vista previa acotada (2 líneas, con "…") de un texto largo dentro de
       las tarjetas del detalle: para ver el resto hay que abrir el panel
       lateral con el botón "Ver". */
    .texto-recortado-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Inputs súper compactos para edición en línea */
    .input-compact {
      font-size: 0.72rem;
      padding: 0.15rem 0.25rem;
      height: 26px;
      width: 100%;
    }

    /* Ajustes visuales de badges y botones pequeños */
    .badge-xs {
      font-size: 0.68rem;
      padding: 0.2em 0.4em;
    }

    .btn-xs {
      padding: 0.15rem 0.35rem;
      font-size: 0.75rem;
      line-height: 1;
      border-radius: 4px;
    }


    /* Encabezado de cada sección desplegable del formulario de Estudio x
       Colega: sombreado propio (distinto del blanco del contenido) para que
       se note de un vistazo que es un acordeón clickeable, con un borde
       izquierdo de acento cuando está abierto. */
    .section-toggle {
      background: #eef1f8;
      border: none;
      border-left: 3px solid transparent;
      width: 100%;
      transition: background .15s ease, border-color .15s ease;
    }

    .section-toggle:hover {
      background: #e3e8f5;
    }

    .section-toggle.section-toggle-open {
      border-left-color: #3cbad6;
    }

    .section-content {
      background: #fbfcff;
    }

    /* Botones de navegación en la barra superior (reemplazan al sidebar) */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #111c2d;
      border: 1px solid transparent;
      background: transparent;
      transition: all .15s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      background: #f0f3ff;
      border-color: #d8e3fb;
    }

    /* Botón activo (pantalla actual): tinte muy sutil de #3cbad6, no el color
       sólido (ése queda para botones de acción como "Nuevo Estudio" y para
       los títulos, vía el token "primary" de Tailwind). */
    .nav-btn.active {
      background: rgba(60, 186, 214, 0.14);
      color: #0f7f97;
      border-color: rgba(60, 186, 214, 0.3);
    }

    /* Mismo criterio para los ítems activos de los dropdowns/sub-menús de la
       barra de navegación (Bootstrap los pintaría de azul por defecto). */
    .dropdown-item.active,
    .dropdown-item:active {
      background: rgba(60, 186, 214, 0.14) !important;
      color: #0f7f97 !important;
    }

    /* Card seleccionada en un split view (master list de Obras Sociales,
       Nomencladores, Autorizadores, Tarifarios): borde más grueso + una
       línea aún más gruesa pegada al margen izquierdo, ambas en "primary". */
    .master-card-selected {
      border-color: #3cbad6 !important;
      border-width: 2px !important;
      border-left-width: 5px !important;
    }

    /* Chips que usan "primary": versión suave (mismo tinte que .nav-btn.active)
       para que no se confundan con el borde de selección de arriba, que sí
       usa el primary sólido. */
    .chip-primary-soft {
      background-color: rgba(60, 186, 214, 0.14) !important;
      color: #0f7f97 !important;
    }

    /* Dropdown "Muestras" de la barra de navegación: se abre con hover, no
       con click (no usa el JS de Bootstrap, sólo su .dropdown-menu para
       posicionar). El padding-top invisible evita que se cierre al mover
       el mouse del botón al menú por el pequeño espacio entre ambos. */
    .hover-dropdown {
      padding-top: 4px;
      margin-top: -4px;
    }

    .hover-dropdown>.dropdown-menu {
      margin-top: 0;
    }

    .hover-dropdown:hover>.dropdown-menu {
      display: block;
    }

    /* Sub-menú anidado ("Muestras" dentro del dropdown "Estudios"): mismo
       truco de hover que arriba, pero se abre hacia la derecha (flyout) en
       vez de hacia abajo, porque ya está dentro de otro dropdown abierto. */
    .dropdown-submenu {
      position: relative;
    }

    .dropdown-submenu>.dropdown-menu {
      top: -0.5rem;
      left: 100%;
      margin-left: 2px;
    }

    .dropdown-submenu:hover>.dropdown-menu {
      display: block;
    }

    .app-content {
      padding: 1.25rem 1.5rem 2.5rem;
    }

    /* Input autocompletable ("combo") de las dimensiones de una muestra:
       ícono de búsqueda a la derecha, y un chip de "crear valor nuevo"
       cuando lo tipeado no matchea ningún valor existente del catálogo. */
    .combo-field {
      position: relative;
    }

    .combo-field .combo-input {
      padding-right: 1.9rem;
    }

    .combo-field-icon {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: #929295;
      font-size: 0.78rem;
      pointer-events: none;
      transition: color .15s ease;
    }

    .combo-input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 0.15rem rgba(34, 211, 238, 0.25);
    }

    .combo-input:focus+.combo-field-icon {
      color: #3cbad6;
    }

    .combo-create-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: 1px dashed #22d3ee;
      background: rgba(34, 211, 238, 0.08);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: #3cbad6;
      margin-top: 0.35rem;
      transition: background .15s ease;
      animation: comboCreateIn .15s ease;
    }

    .combo-create-btn:hover {
      background: rgba(34, 211, 238, 0.2);
    }

    @keyframes comboCreateIn {
      from {
        opacity: 0;
        transform: translateY(-3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Editor de texto enriquecido (negrita/cursiva/listas): barra de comandos
       + un div contenteditable con el mismo look que un textarea normal. */
    .rich-editor {
      border: 1px solid #bbc9cd;
      border-radius: 0.5rem;
      overflow: hidden;
    }

    .rich-toolbar {
      display: flex;
      gap: 0.15rem;
      padding: 0.3rem 0.4rem;
      background: #f0f3ff;
      border-bottom: 1px solid #bbc9cd;
    }

    .rich-toolbar button {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 5px;
      color: #3c494c;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .rich-toolbar button:hover {
      background: #d8e3fb;
      color: #3cbad6;
    }

    .rich-content {
      min-height: 80px;
      max-height: 260px;
      overflow-y: auto;
      padding: 0.4rem 0.6rem;
      font-size: 0.8125rem;
      border: none;
      border-radius: 0;
      outline: none;
    }

    /* Editor ampliado (dentro del modal "Ver ampliado"): mucho más alto para
       trabajar más cómodo en pantalla completa. */
    .rich-editor-lg .rich-content {
      min-height: 60vh;
      max-height: 65vh;
      font-size: 0.9rem;
    }

    .rich-content:empty:before {
      content: attr(data-placeholder);
      color: #929295;
    }

    .rich-content ul,
    .rich-content ol {
      padding-left: 1.25rem;
      margin-bottom: 0.25rem;
    }

    /* Mismas reglas para mostrar (sin editar) contenido guardado con el editor */
    .rich-display ul,
    .rich-display ol {
      padding-left: 1.1rem;
      margin-bottom: 0.25rem;
    }

    /* Panel lateral desde la derecha: Indicaciones al Paciente / Modelo de Informe del Colega */
    .side-panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 28, 45, 0.4);
      z-index: 1050;
    }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 420px;
      max-width: 92vw;
      background: #ffffff;
      z-index: 1060;
      box-shadow: -8px 0 24px rgba(0, 0, 0, .15);
      display: flex;
      flex-direction: column;
    }

    .side-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .side-panel-body {
      padding: 1.25rem;
      overflow-y: auto;
      flex: 1;
    }

    .side-panel-enter-active,
    .side-panel-leave-active {
      transition: transform .22s ease;
    }

    .side-panel-enter-from,
    .side-panel-leave-to {
      transform: translateX(100%);
    }

    /* Pantallas de autenticación (login/registro/recuperar contraseña) */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: linear-gradient(160deg, #f0f3ff 0%, #f9f9ff 60%);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 30px -8px rgba(0, 104, 119, 0.15);
      padding: 2rem;
    }

    .auth-logo {
      height: 44px;
      object-fit: contain;
      display: block;
      margin: 0 auto 1.25rem;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- ========================================================= -->
    <!-- AUTENTICACIÓN: login / registro / olvidé mi contraseña /   -->
    <!-- restablecer contraseña. Sin sesión, es lo único visible.   -->
    <!-- ========================================================= -->
    <div class="auth-page" v-if="!isLoggedIn">
      <div class="auth-card">
        <img alt="Sanatorio Británico" class="auth-logo"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8xjJ6dJRSLRqt7KpYtEpbz7Gh2PWgyJUdtyTzFH-v9uJDhLskF5kdd21XrWw0IH6pe_CyvdbVHVIAwOYaYfLJIXcw9N_OLSidR66D8ARKIULP_I68ylkIQO5vjPAVIJBIy_7aMTj_u6_-njf2z5pqj6ZW9-t-hpkWer-ohlfI_WjkoGXsfBE9zNJizKcgb2Czsn6Kr4aWF1_DGKMzcbWVXgYQrBnlWgaE76HTgG9FXxyFbz63URtfyjA2Oz-puz5kkw" />

        <div class="alert alert-danger rounded-lg text-xs" role="alert" v-if="authError">{{ authError }}</div>

        <!-- LOGIN -->
        <template v-if="authView === 'login'">
          <h5 class="text-center font-bold text-primary mb-1">Gestión de Laboratorio</h5>
          <p class="text-center text-on-surface-variant text-xs mb-4">Iniciá sesión para continuar</p>
          <form @submit.prevent="login($event)" novalidate>
            <div class="mb-3">
              <label class="form-label text-xs font-semibold">Usuario</label>
              <input class="form-control form-control-sm rounded-lg" required type="text" v-model="authForm.username"
                autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label text-xs font-semibold">Contraseña</label>
              <input class="form-control form-control-sm rounded-lg" required type="password"
                v-model="authForm.password" />

                    <dt class="col-md-3 text-on-surface-variant">Fecha de última edición</dt>

                <button :disabled="faqGuardando"
                  class="btn btn-sm btn-primary bg-primary border-primary shadow-sm rounded-lg px-3" type="submit">{{
                  faqGuardando ? 'Guardando...' : 'Guardar' }}</button>

            </form>
          </div>

          <!-- ========================================================= -->
          <!-- VISTA 3: FORMULARIO ESTUDIO x COLEGA (pantalla completa,   -->
          <!-- no modal, para más espacio y claridad)                    -->
          <!-- ========================================================= -->
          <div v-if="currentView === 'estudio_colega_form'">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="mb-0 text-primary font-bold text-xl">
                {{ modalMode === 'create' ? 'Nuevo Estudio por laboratorio procesante' : 'Editar Estudio por laboratorio procesante' }}
              </h4>
              <button @click="cancelEstudioColegaForm"
                class="btn btn-sm btn-light border-outline-variant text-on-surface rounded-lg px-3" type="button">
                <i class="bi bi-arrow-left me-1"></i>Volver
              </button>
            </div>

            <form @submit.prevent="saveItem($event)" novalidate>
              <div :key="section.key" class="border border-outline-variant rounded-lg mb-3 overflow-hidden"
                v-for="section in ESTUDIO_COLEGA_SECCIONES">
                <button @click="toggleSection(section.key)"

                    <span class="d-block font-bold text-primary">{{ section.title }}</span>
                    <span class="d-block text-xs text-on-surface-variant">{{ section.desc }}</span>
                  </span>
                  <i :class="['bi', sectionsOpen[section.key] ? 'bi-chevron-up' : 'bi-chevron-down']"></i>
                </button>

                <div class="section-content p-3 border-t border-outline-variant" v-if="sectionsOpen[section.key]">
                  <!-- Sección Muestras: editor de N muestras con alternativas y orden -->

                    <div class="d-flex justify-content-between align-items-center mb-3">
                      <p class="text-on-surface-variant text-xs mb-0">Las muestras se guardan junto con el resto del

                    <div class="text-center py-3" v-if="muestrasLoading">
                      <div class="spinner-border spinner-border-sm text-primary-container" role="status"></div>
                    </div>
                    <p class="text-on-surface-variant text-xs" v-else-if="!muestrasForm.length">
                      Todavía no se cargó ninguna muestra para este estudio.
                    </p>

                    <div :key="m._key"
                      class="border border-outline-variant rounded-lg p-3 mb-3 bg-surface-container-low"
                      v-for="(m, idx) in muestrasForm">

                        <span class="font-bold text-sm">Muestra {{ idx + 1 }}</span>
                        <div class="d-flex gap-1">
                          <button :disabled="idx === 0" @click="moveMuestraRow(idx, -1)"

                          </button>
                          <button :disabled="idx === muestrasForm.length - 1" @click="moveMuestraRow(idx, 1)"

                            <i class="bi bi-arrow-down"></i>
                          </button>

                            <i class="bi bi-copy"></i>
                          </button>
                          <button @click="removeMuestraRow(idx)" class="btn btn-xs btn-outline-danger" title="Quitar"
                            type="button">
                            <i class="bi bi-trash"></i>
                          </button>
                        </div>
                      </div>
                      <div class="row g-2">
                        <div :key="c.field" class="col-md-3" v-for="c in MUESTRA_CAMPOS">

                                placeholder="Escribí para buscar..." type="text" />
                              <i class="bi bi-search combo-field-icon"></i>
                            </div>
                            <datalist :id="'dl_' + m._key + '_' + c.field">
                              <option :key="opt.id" :value="opt.nombre" v-for="opt in refData[c.ref]"></option>
                            </datalist>
                            <button v-if="comboNeedsCreate(m, c)" @click="crearValorCombo(m, c)"
                              class="combo-create-btn" type="button">
                              <i class="bi bi-plus-lg"></i>Crear "{{ m['_text_' + c.field] }}"
                            </button>
                          </template>
                          <input class="form-control form-control-sm rounded-lg border-outline-variant" step="0.01"

                        </div>
                        <div class="col-md-6">
                          <label class="form-label text-xs font-semibold text-on-surface mb-1">Observación específica de
