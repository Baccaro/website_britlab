server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Evita que el navegador cachee el HTML/JS de la SPA: sin esto, tras un
        # rebuild se puede quedar sirviendo una mezcla de index.html nuevo con
        # app.js viejo (o viceversa) desde la caché del navegador.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Redirigir llamadas de la API al contenedor web de Flask
    location /api/ {
        proxy_pass http://web:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
