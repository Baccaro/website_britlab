services:
  web:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  production:
    build:
      context: .
      target: production
    ports:
      - "8081:80"

volumes:
  node_modules:
